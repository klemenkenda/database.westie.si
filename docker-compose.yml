# Local stack, shaped like the target host: Apache serves public/, and content/ sits
# above the document root where HTTP cannot reach it.
#
#   docker compose up -d api          → API + exported site on http://localhost:8081
#   docker compose run --rm test      → the API test suite against a live container
#   docker compose up web             → Next.js dev server on http://localhost:3001
#
# The project is bind-mounted, so edits on the host are live and writes made through the
# API land in the working tree — which is the point: content/ is the database.

services:
  api:
    build: ./docker
    container_name: westie-db-api
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    environment:
      WESTIE_CONTENT_ROOT: /var/www/html/content
      WESTIE_CORS_ORIGIN: "*"
      # WESTIE_WRITE_TOKEN: set this to require a token for writes
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api/health') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:22-alpine
    container_name: westie-db-web
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - ./public:/public
      # Same reason as the build service: content/ must be reachable at /content or every
      # page renders with an empty database.
      - ./content:/content:ro
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8081/api
      # Watch by polling, because the bind mount delivers no inotify events from a Windows
      # host: the container reads the edited file correctly, but webpack is never told it
      # changed, so `next dev` serves a stale compile and looks like it is ignoring you.
      # Costs a little idle CPU and is the difference between HMR working and not.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api

  # One-shot helpers. `docker compose run --rm <name>`; not started by `up`.
  test:
    build: ./docker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      WESTIE_API: http://api/api
      WESTIE_CONTENT_ROOT: /var/www/html/content
    command: php tools/api_test.php
    depends_on:
      - api
    profiles: ["tools"]

  # Build the site and publish it into the document root in one step.
  #
  # `npm run build` alone is not enough: it writes web/out/, and Apache serves public/. A
  # build without the publish looks successful and changes nothing about what
  # localhost:8081 returns, which is a confusing failure to debug. So the two are one
  # command, and publish_site.py refuses to touch public/api/.
  build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - ./public:/public
      # web/lib/content.ts reads `process.cwd()/../content` at build time. With working_dir
      # /app that is /content, and without this mount the build silently succeeded while
      # producing a site with zero concepts in it — every page rendered, every count read
      # 0. Read-only because a build has no business writing to the database.
      - ./content:/content:ro
    # The delete step names what it *keeps* rather than what it removes. Listing the
    # export's own directories to delete means every new route added later silently stops
    # being cleaned, and a renamed page lingers at its old URL — the exact bug
    # publish_site.py's KEEP set exists to prevent. Same rule, expressed in shell.
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run build &&
             find /public -mindepth 1 -maxdepth 1 -not -name api -exec rm -rf {} + &&
             cp -a out/. /public/ &&
             echo 'published to public/ — public/api/ untouched'"
    profiles: ["tools"]
